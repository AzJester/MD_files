/* Design tokens. Dark is the default theme. */
:root,[data-theme="dark"]{
  --carbon:#090a0b;--gunmetal:#0e0f11;--graphite:#1c1e22;--slate:#3e3f41;--steel:#7f848e;--muted-gray:#8e8e8d;--bone:#e7e5df;--marine-blue:#102a47;--ion-cyan:#33c7eb;--flare:#defbfd;--paper:#ffffff;
  --surface:var(--carbon);--surface-raised:var(--gunmetal);--surface-sunken:var(--graphite);--surface-inverse:var(--bone);
  --ink:var(--bone);--ink-muted:var(--muted-gray);--ink-subtle:var(--steel);--ink-inverse:var(--carbon);
  --accent:var(--ion-cyan);--ink-on-accent:var(--carbon);--accent-text:var(--ion-cyan);--accent-soft:var(--flare);
  --border-hairline:var(--slate);--border-control:var(--steel);--focus-ring:var(--ion-cyan);
  --font-sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --side:320px;--outline:248px;color-scheme:dark;
}
[data-theme="light"]{
  --surface:var(--paper);--surface-raised:var(--bone);--surface-sunken:var(--bone);--surface-inverse:var(--carbon);
  --ink:var(--carbon);--ink-muted:var(--slate);--ink-subtle:var(--slate);--ink-inverse:var(--bone);
  --accent-text:var(--marine-blue);--border-hairline:var(--muted-gray);--border-control:var(--slate);--focus-ring:var(--marine-blue);color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
mark.hl{background:var(--accent-soft);color:var(--carbon)}
html,body{margin:0;height:100%;background:var(--surface);color:var(--ink);font:400 16px/25px var(--font-sans)}
body{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
::selection{background:var(--accent);color:var(--ink-on-accent)}
.icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
.i16{width:16px;height:16px}
.mono{font-family:var(--font-mono);text-transform:uppercase}
.sprite{display:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border-hairline)}::-webkit-scrollbar-track{background:transparent}

/* Layout */
.app{height:100vh;display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.app.no-side{grid-template-columns:0 minmax(0,1fr)}
.app.no-side .sidebar{visibility:hidden}

/* Sidebar */
.sidebar{background:var(--surface-raised);border-right:1px solid var(--border-hairline);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.side-head{padding:24px 20px 16px}
.brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.wordmark{font:800 15px/20px var(--font-sans);letter-spacing:.04em;text-transform:uppercase}
[data-theme="dark"] .logo-carbon,[data-theme="light"] .logo-bone{display:none}
.product{font:500 11px/14px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted)}
.actions{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px}
.actions .btn{padding:6px 8px;letter-spacing:.08em;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:6px 12px;border:1px solid var(--border-control);background:transparent;color:var(--ink);border-radius:0;cursor:pointer;font:500 11px/14px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.btn:hover{background:var(--surface-sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink-on-accent)}
.btn.primary:hover{background:var(--accent-soft);border-color:var(--accent-soft)}
.btn.ghost{border-color:transparent;color:var(--ink-muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-sunken)}
.btn.icon-only{padding:6px 8px}
.btn[aria-pressed="true"]{color:var(--ink);background:var(--surface-sunken)}
[data-mode="live"] [data-only="browser"],[data-mode="browser"] [data-only="live"]{display:none!important}
.source{display:flex;align-items:center;gap:12px;border:1px solid var(--border-hairline);border-left:2px solid var(--accent);padding:10px 12px;margin-bottom:12px}
.source .what{flex:1;min-width:0}
.source .k{display:block;font:500 10px/14px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted)}
.source .v{display:block;font-size:14px;line-height:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchbox{position:relative;margin-top:16px}
.searchbox .icon{position:absolute;left:10px;top:10px;color:var(--ink-muted);pointer-events:none}
.searchbox input{width:100%;height:40px;border:1px solid var(--border-control);border-radius:0;background:var(--surface);padding:0 64px 0 38px;font-size:14px;outline-offset:0}
.searchbox input{-webkit-appearance:none;appearance:none}.searchbox input::-webkit-search-cancel-button,.searchbox input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.searchbox input::placeholder{color:var(--ink-subtle)}
.searchbox .kbd{position:absolute;right:8px;top:11px;font:400 11px/16px var(--font-mono);letter-spacing:.06em;color:var(--ink-subtle);border:1px solid var(--border-hairline);padding:0 5px;border-radius:2px}
.searchbox .clear{position:absolute;right:3px;top:3px;min-height:34px;display:none}
.searchbox.has-q .kbd{display:none}.searchbox.has-q .clear{display:inline-flex}
.side-body{flex:1;overflow:auto;padding:8px 12px 24px}
.sec-label{display:flex;align-items:center;gap:12px;font:500 11px/14px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);margin:16px 8px 8px}
.sec-label::after{content:"";flex:1;border-top:1px solid var(--border-hairline)}
.sec-label .aside{order:2;font-weight:400;letter-spacing:.06em}
.sec-label .link{order:3;background:none;border:0;padding:0;cursor:pointer;color:var(--ink-subtle);font:inherit;letter-spacing:.06em;text-transform:uppercase}
.sec-label .link:hover{color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:4px 8px 4px calc(8px + var(--d,0) * 16px);border:0;border-left:2px solid transparent;background:none;cursor:pointer;text-align:left;font-size:14px;line-height:20px;color:var(--ink)}
.row:hover{background:var(--surface-sunken)}
.row .icon{color:var(--ink-muted)}
.row.folder{color:var(--ink-muted)}
.row.folder:hover{color:var(--ink)}
.row .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{font:400 11px/14px var(--font-mono);color:var(--ink-subtle)}
.row.active{background:var(--surface-sunken);border-left-color:var(--accent);font-weight:600}
.row.active .icon{color:var(--ink)}
.row .sub{display:block;font:400 11px/16px var(--font-mono);letter-spacing:.06em;color:var(--ink-subtle);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font:500 10px/14px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);border:1px solid var(--border-control);border-radius:2px;padding:0 4px;flex:none}
.hit{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;border-bottom:1px solid var(--border-hairline);padding:12px 8px;cursor:pointer;color:var(--ink)}
.hit:hover{background:var(--surface-sunken)}
.hit.active{border-left-color:var(--accent);background:var(--surface-sunken)}
.hit-name{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;line-height:20px}
.hit-name .tag{font-weight:400}
.hit-path{display:block;font:400 11px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit-snip{display:block;font-size:13px;line-height:19px;color:var(--ink-muted);margin-top:6px}
.empty-side{padding:16px 8px;color:var(--ink-muted);font-size:14px;line-height:21px}
.side-foot{border-top:1px solid var(--border-hairline);padding:12px 20px 14px;display:grid;gap:6px;font:400 11px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle)}
.side-foot .line{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px}
.side-foot .link{background:none;border:0;padding:0;cursor:pointer;color:var(--accent-text);font:inherit;letter-spacing:inherit;text-transform:inherit;text-decoration:underline;text-underline-offset:3px}
.side-foot .warn{color:var(--ink)}

/* Main */
.main{min-width:0;height:100vh;display:flex;flex-direction:column;background:var(--surface)}
.toolbar{flex:none;display:flex;align-items:center;gap:8px;min-height:64px;padding:10px 16px;border-bottom:1px solid var(--border-hairline)}
.titleblock{flex:1;min-width:0;padding-left:4px}
.titleblock .name{font-weight:700;font-size:15px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titleblock .path{font:400 11px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font:400 11px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);white-space:nowrap}
.findbar{display:none;align-items:center;gap:2px;border:1px solid var(--border-hairline);padding:0 0 0 10px;height:36px}
.findbar.show{display:flex}
.findbar .count{font:400 11px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin-right:4px;white-space:nowrap}
.tb-sep{width:1px;height:24px;background:var(--border-hairline);margin:0 4px}
.doc-only{display:contents}
.no-doc .doc-only,.no-doc .doc-meta{display:none}
.content{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--outline)}
.app.no-outline .content,.main.editing .content{grid-template-columns:minmax(0,1fr)}
.app.no-outline .outline,.main.editing .outline,.no-doc .outline{display:none}
.no-doc .content{grid-template-columns:minmax(0,1fr)}
.editor{display:none;border-right:1px solid var(--border-hairline);min-height:0}
.main.editing .content{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.main.editing .editor{display:flex;flex-direction:column}
.editor-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border-hairline);font:500 11px/14px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted)}
#raw{flex:1;width:100%;resize:none;border:0;outline:0;padding:24px;background:var(--surface-sunken);color:var(--ink);font:400 14px/22px var(--font-mono);tab-size:4}
.reader{overflow:auto;min-height:0;scroll-behavior:smooth}
.page{max-width:820px;margin:0 auto;padding:48px 56px 96px}
.doc-meta{display:flex;flex-wrap:wrap;gap:8px 24px;font:400 11px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);padding-bottom:16px;margin-bottom:40px;border-bottom:1px solid var(--border-hairline)}
.doc-meta .flag{color:var(--ink)}
.outline{border-left:1px solid var(--border-hairline);overflow:auto;padding:24px 16px 48px}
.outline .sec-label{margin:0 0 12px}
.ol-item{display:block;padding:5px 8px 5px calc(8px + var(--l,0) * 12px);border-left:2px solid transparent;color:var(--ink-muted);text-decoration:none;font-size:13px;line-height:18px}
.ol-item:hover{color:var(--ink)}
.ol-item.active{color:var(--ink);border-left-color:var(--accent)}
.ol-empty{color:var(--ink-subtle);font-size:13px;line-height:19px;margin:0 8px}

/* Rendered Markdown */
.doc{overflow-wrap:anywhere}
.doc>:first-child{margin-top:0}
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6{font-family:var(--font-sans);scroll-margin-top:24px;color:var(--ink)}
.doc h1{font-size:34px;line-height:36px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;margin:0 0 24px}
.doc h2{font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.005em;margin:56px 0 16px;padding-top:24px;border-top:1px solid var(--border-hairline)}
.doc h3{font-size:19px;line-height:26px;font-weight:700;margin:40px 0 12px}
.doc h4{font-size:16px;line-height:24px;font-weight:700;margin:32px 0 8px}
.doc h5,.doc h6{font:500 11px/14px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);margin:32px 0 8px}
.doc p{margin:0 0 16px}
.doc li{line-height:26px}
.doc ul,.doc ol{margin:0 0 16px;padding-left:24px}
.doc li>ul,.doc li>ol{margin:4px 0 4px}
.doc li+li{margin-top:4px}
.doc li>p{margin:0 0 8px}
.doc li.task{list-style:none;margin-left:-24px}
.doc li.task input{margin:0 10px 0 0;accent-color:var(--accent);vertical-align:-2px}
.doc a{color:var(--accent-text);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.doc a:hover{text-decoration-thickness:2px}
.doc a.broken{color:var(--ink-muted);text-decoration-style:dotted;cursor:help}
.doc strong{font-weight:700}
.doc code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-sunken);padding:1px 5px}
.doc pre{position:relative;background:var(--surface-sunken);border:1px solid var(--border-hairline);padding:20px;overflow:auto;margin:0 0 24px;font:400 13px/21px var(--font-mono)}
.doc pre code{background:none;padding:0;font-size:inherit}
.doc pre .lang{position:absolute;left:20px;top:6px;font:500 10px/14px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-subtle)}
.doc pre.has-lang{padding-top:28px}
.doc pre .code-copy{position:absolute;right:6px;top:6px;min-height:28px;padding:2px 8px;opacity:0}
.doc pre:hover .code-copy,.doc pre .code-copy:focus-visible{opacity:1}
.doc blockquote{margin:0 0 16px;padding:2px 0 2px 20px;border-left:2px solid var(--border-control);color:var(--ink-muted)}
.doc blockquote>:last-child{margin-bottom:0}
.doc .callout{margin:0 0 24px;padding:16px 20px;border:1px solid var(--border-hairline);border-left:2px solid var(--ink);background:var(--surface-raised)}
.doc .callout>:last-child{margin-bottom:0}
.doc .callout-label{display:block;font:500 11px/14px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}
.doc hr{border:0;border-top:1px solid var(--border-hairline);margin:40px 0}
.doc .table-wrap{overflow-x:auto;margin:0 0 24px}
.doc table{width:100%;border-collapse:collapse;font-size:14px;line-height:21px}
.doc th{background:var(--surface-inverse);color:var(--ink-inverse);font-weight:600;text-align:left;padding:10px 12px;vertical-align:bottom}
.doc td{padding:10px 12px;border-bottom:1px solid var(--border-hairline);vertical-align:top}
.doc img{max-width:100%;height:auto;display:inline-block}
.doc .img-missing{display:inline-block;border:1px solid var(--border-hairline);padding:8px 12px;font-size:13px;color:var(--ink-muted)}
.doc kbd{font:400 12px/18px var(--font-mono);border:1px solid var(--border-control);border-radius:2px;padding:0 5px}
.doc mark,.doc .hl{background:var(--accent-soft);color:var(--carbon)}
.doc mark.current{background:var(--accent);color:var(--ink-on-accent);outline:2px solid var(--accent)}
.frontmatter{display:grid;grid-template-columns:max-content 1fr;margin:-24px 0 40px}
.frontmatter dt,.frontmatter dd{margin:0;padding:8px 0;border-bottom:1px solid var(--border-hairline)}
.frontmatter dt{font:500 11px/22px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);padding-right:32px}
.frontmatter dd{font:400 14px/22px var(--font-mono);color:var(--ink)}

/* Empty and missing states */
.hero{max-width:820px;margin:0 auto;padding:96px 56px}
.hero .sec-label{margin:0 0 32px}
.hero h1{font:800 48px/46px var(--font-sans);letter-spacing:-.015em;text-transform:uppercase;margin:0 0 24px;max-width:18ch}
.hero .lead{font-size:18px;line-height:28px;color:var(--ink-muted);max-width:56ch;margin:0 0 32px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:64px}
.hero .ctas .btn{min-height:44px;padding:10px 18px}
.spec{display:grid;grid-template-columns:max-content 1fr;border-top:1px solid var(--border-hairline);max-width:640px}
.spec dt,.spec dd{margin:0;padding:10px 0;border-bottom:1px solid var(--border-hairline)}
.spec dt{font:500 11px/22px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);padding-right:40px}
.spec dd{font:400 14px/22px var(--font-mono);color:var(--ink)}

/* Menus, toast, drop */
.menu{position:fixed;z-index:60;min-width:220px;background:var(--surface-raised);border:1px solid var(--border-control);padding:4px 0;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;background:none;border:0;cursor:pointer;text-align:left;font-size:14px;line-height:20px;color:var(--ink)}
.menu button .icon{color:var(--ink-muted)}
.menu button:hover,.menu button:focus-visible{background:var(--surface-sunken)}
.menu hr{border:0;border-top:1px solid var(--border-hairline);margin:4px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--surface-inverse);color:var(--ink-inverse);padding:10px 16px;font:500 11px/16px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;display:none;max-width:calc(100vw - 32px)}
.toast.show{display:block}
.drop{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:color-mix(in srgb,var(--surface) 92%,transparent);border:2px dashed var(--accent);pointer-events:none}
.drop.show{display:grid}
.drop span{font:500 11px/14px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.scrim{display:none}
.print-head{display:none}

@media (max-width:1180px){.content{grid-template-columns:minmax(0,1fr)}.outline,#outlineBtn{display:none}}
@media (max-width:860px){
  .app,.app.no-side{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;z-index:50;inset:0 auto 0 0;width:min(88vw,340px);transform:translateX(-100%);visibility:visible!important}
  .app.side-open .sidebar{transform:none}
  .app.side-open .scrim{display:block;position:fixed;inset:0;z-index:45;background:color-mix(in srgb,var(--carbon) 60%,transparent)}
  .page{padding:32px 16px 64px}.hero{padding:48px 16px}.hero h1{font-size:34px;line-height:36px}
  .toolbar{padding:8px 12px}.btn .lbl{display:none}.status{display:none}
  .main.editing .content{grid-template-columns:minmax(0,1fr);grid-template-rows:45% 55%}
  .main.editing .editor{border-right:0;border-bottom:1px solid var(--border-hairline)}
}

@media print{
  :root[data-theme]{--surface:#fff;--surface-raised:#e7e5df;--surface-sunken:#e7e5df;--surface-inverse:#090a0b;--ink:#090a0b;--ink-muted:#3e3f41;--ink-subtle:#3e3f41;--ink-inverse:#e7e5df;--accent-text:#102a47;--border-hairline:#8e8e8d;--border-control:#3e3f41}
  @page{margin:18mm 16mm}
  html,body{height:auto;background:#fff}body{overflow:visible}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .app{display:block;height:auto}
  .sidebar,.toolbar,.outline,.editor,.menu,.toast,.drop,.code-copy,.doc-meta{display:none!important}
  .main,.content,.reader{display:block;height:auto;overflow:visible}
  .page{max-width:none;padding:0}
  .print-head{display:flex;gap:24px;justify-content:space-between;align-items:center;border-bottom:1px solid #8e8e8d;padding-bottom:10px;margin-bottom:28px;font:400 9px/12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:#3e3f41}
  .print-head .wordmark{font-size:10px;line-height:12px;color:#090a0b}
  .doc mark,.doc .hl{background:none;color:inherit}
  .doc pre,.doc table,.doc img,.doc blockquote{break-inside:avoid}
  .doc h1,.doc h2,.doc h3{break-after:avoid}
  .doc a.ext::after{content:" (" attr(href) ")";font-size:.8em;color:#3e3f41}
}
</style>

bol id="i-print" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H4V9h16v8h-3M7 14h10v6H7z"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M4 20h16"/></symbol></svg>

<script>
(()=>{"use strict";
const DB="offline_markdown_library_db",STORE="files",PREF="aml.prefs.v2";
const DOC_RE=/\.(md|markdown|mdown|mkd|txt)$/i,IMG_RE=/\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i,MAX_IMG=15*1024*1024;
const $=id=>document.getElementById(id);
const app=$("app"),main=$("main"),doc=$("doc"),reader=$("reader"),raw=$("raw"),sideBody=$("sideBody"),search=$("search");
const state={files:[],byPath:new Map(),lcPath:new Map(),current:null,terms:[],hits:[],marks:[],markIx:0,editing:false,unsaved:false,saveT:0,renderT:0,searchT:0,lc:new Map()};

/* Utilities */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const cur=()=>state.byPath.get(state.current);
const decodeSafe=s=>{try{return decodeURIComponent(s)}catch{return s}};
const normPath=p=>String(p||"untitled.md").replace(/\\/g,"/").replace(/^\/+/,"").replace(/(^|\/)\.\//g,"$1").replace(/\/{2,}/g,"/");
const fmtDate=t=>new Date(t).toLocaleDateString("en-US",{day:"numeric",month:"short",year:"numeric"});
const fmtTime=t=>new Date(t).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false});
const fmtBytes=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(1)+" MB";

/* Storage (IndexedDB, same database as the original tool so existing libraries carry over) */
let dbP;const HSTORE="handles";

/* Live folder mode: read and write the original files through the File System Access API (Chrome, Edge).

const live={on:false,root:null,handles:new Map(),urls:[],lastScan:0,scanning:false};
const canLive=()=>typeof window.showDirectoryPicker==="function";
async function dirFor(path,create){let d=live.root;const parts=path.split("/");for(const p of parts.slice(0,-1))d=await d.getDirectoryHandle(p,{create});return d}

  const prev=new Map(state.files.map(f=>[f.path,f])),out=[],handles=new Map(),urls=[];

    for await(const [name,h] of dir.entries()){
      if(name.startsWith(".")||name==="node_modules")continue;
      const p=prefix+name;
      if(h.kind==="directory"){await walk(h,p+"/");continue}
      const isD=DOC_RE.test(name),isI=IMG_RE.test(name);if(!isD&&!isI)continue;
      const file=await h.getFile();handles.set(p,h);
      const old=prev.get(p);
      if(old&&old.diskModified===file.lastModified&&old.size===file.size){out.push(old);if(old.url)urls.push(old.url);continue}
      if(isD)out.push({path:p,name,kind:"doc",content:await file.text(),size:file.size,modified:file.lastModified,diskModified:file.lastModified});
      else if(file.size<=MAX_IMG){const url=URL.createObjectURL(file);urls.push(url);out.push({path:p,name,kind:"asset",content:url,url,blob:file,size:file.size,modified:file.lastModified,diskModified:file.lastModified})}

  live.urls.filter(u=>!urls.includes(u)).forEach(u=>URL.revokeObjectURL(u));live.urls=urls;

}
async function hasPermission(h,ask){if(!h.queryPermission)return true;const o={mode:"readwrite"};if(await h.queryPermission(o)==="granted")return true;return ask?(await h.requestPermission(o))==="granted":false}
async function startLive(h,ask,restore){
  if(!(await hasPermission(h,ask)))return false;
  flushSave();if(state.editing)setEditing(false);
  live.on=true;live.root=h;state.files=[];state.current=null;
  prefs.mode="live";savePrefs();await setHandle(h);
  document.documentElement.dataset.mode="live";$("liveName").textContent=h.name;$("liveName").title=h.name;
  $("editHint").textContent="Autosaves to disk";
  expanded.clear();
  await refresh();
  const r=restore&&parseHash();
  if(r&&lookup(r.path)){route()}
  else{const first=(restore&&prefs.recent.find(p=>state.byPath.has(p)))||docs().find(d=>/^(readme|index)\.md$/i.test(d.path))?.path||docs()[0]?.path;
    history.replaceState(null,"",location.pathname+location.search);if(first)go(first);else showEmpty()}
  toast(restore?`Reconnected to ${h.name}`:`Opened ${h.name}. Edits save to the original files.`);

}
async function stopLive(){
  flushSave();if(state.editing)setEditing(false);
  live.urls.forEach(u=>URL.revokeObjectURL(u));Object.assign(live,{on:false,root:null,handles:new Map(),urls:[]});

  state.current=null;state.files=[];history.replaceState(null,"",location.pathname+location.search);
  await refresh();const first=prefs.recent.find(p=>state.byPath.has(p))||docs()[0]?.path;if(first)go(first);else showEmpty();
}
async function rescan(quiet){
  if(!live.on||live.scanning)return;live.scanning=true;
  try{
    const before=cur(),beforeMod=before&&before.diskModified;
    await refresh();
    const after=cur();
    if(state.current&&!after){toast("This document was moved or deleted on disk");showMissing(state.current)}
    else if(after&&after.diskModified!==beforeMod&&!state.unsaved){if(state.editing)raw.value=after.content;renderDoc(after.content,{scroll:false});meta(after);toast("Reloaded changes from disk")}

  }catch(e){console.error(e);toast("Could not read the folder. It may have been moved or access was revoked.")}

}
window.addEventListener("focus",()=>{if(live.on&&Date.now()-live.lastScan>3000)rescan(true)});

/* Persistence that works in both modes */
async function persist(items){
  if(!live.on)return dbPutRaw(items);
  for(const f of items){if(!isDoc(f))continue;f.diskModified=await liveWrite(f.path,f.content);f.modified=f.diskModified}
}
const dbPut=persist;
async function removeFiles(paths){if(live.on){for(const p of paths)await liveRemove(p)}else await dbDel(paths)}

const clean=f=>({path:f.path,name:f.name,kind:f.kind||(isDoc(f)?"doc":"asset"),content:f.content,mime:f.mime||"",size:f.size||0,modified:f.modified||Date.now(),imported:f.imported||f.modified||Date.now(),edited:!!f.edited});

async function refresh(){
  const all=(live.on?await scanFolder():await dbAll()||[]).filter(f=>f&&typeof f.path==="string"&&typeof f.content==="string");
  all.sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true,sensitivity:"base"}));
  state.files=all;state.byPath=new Map(all.map(f=>[f.path,f]));state.lcPath=new Map(all.map(f=>[f.path.toLowerCase(),f.path]));
  prefs.recent=prefs.recent.filter(p=>state.byPath.has(p));
  if(state.terms.length)runSearch(search.value,true);
  drawSidebar();updateFooter();
}

/* Import */
async function entriesFromDrop(dt){
  const roots=[...(dt.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  const loose=[...(dt.files||[])];
  if(!roots.length)return loose.map(f=>({file:f,path:f.name}));
  const out=[];
  async function walk(e,prefix){
    if(e.isFile){out.push({file:await new Promise((r,j)=>e.file(r,j)),path:prefix+e.name})}
    else if(e.isDirectory){const rd=e.createReader();let batch;do{batch=await new Promise((r,j)=>rd.readEntries(r,j));for(const c of batch)await walk(c,prefix+e.name+"/")}while(batch.length)}
  }
  for(const e of roots)await walk(e,"");
  return out;
}

  if(live.on){toast("Close the live folder to import into the browser library");return}
  const pick=[],tooBig=[];let other=0;
  for(const e of entries){const p=normPath(e.path);if(/(^|\/)(\.|node_modules\/)/.test(p))continue;
    if(DOC_RE.test(p))pick.push({...e,path:p,kind:"doc"});else if(IMG_RE.test(p)){if(e.file.size>MAX_IMG)tooBig.push(p);else pick.push({...e,path:p,kind:"asset"})}else other++}
  if(!pick.length){toast(tooBig.length?"Images over 15 MB are skipped":"No Markdown, text or image files found");return}
  const conflicts=pick.filter(e=>e.kind==="doc"&&state.byPath.get(e.path)?.edited);
  let skip=new Set();
  if(conflicts.length){
    const list=conflicts.slice(0,8).map(c=>"  "+c.path).join("\n")+(conflicts.length>8?`\n  and ${conflicts.length-8} more`:"");
    if(!confirm(`${plural(conflicts.length,"document")} you edited in this library would be replaced by the imported copy:\n\n${list}\n\nOK replaces them. Cancel keeps your edits and imports everything else.`))skip=new Set(conflicts.map(c=>c.path));
  }
  const now=Date.now(),recs=[];
  for(const e of pick){if(skip.has(e.path))continue;
    const content=e.kind==="doc"?await e.file.text():await readDataURL(e.file);
    recs.push({path:e.path,name:baseName(e.path),kind:e.kind,content,mime:e.file.type||"",size:e.file.size,modified:e.file.lastModified||now,imported:now,edited:false})}
  await dbPut(recs);await refresh();requestPersist();
  const nd=recs.filter(r=>r.kind==="doc").length,ni=recs.length-nd;
  toast(`Imported ${plural(nd,"document")}${ni?`, ${plural(ni,"image")}`:""}${tooBig.length?`. ${tooBig.length} oversize skipped`:""}`);
  const firstDoc=recs.find(r=>r.kind==="doc");
  if(firstDoc){if(!state.current)go(firstDoc.path);else{expandTo(firstDoc.path);drawSidebar()}}
  else if(state.current)show(state.current,{keep:true});
}
$("fileInput").onchange=e=>{importEntries([...e.target.files].map(f=>({file:f,path:f.name})));e.target.value=""};
$("folderInput").onchange=e=>{importEntries([...e.target.files].map(f=>({file:f,path:f.webkitRelativePath||f.name})));e.target.value=""};

/* Markdown renderer: CommonMark-leaning, GitHub-flavored tables, tasks, callouts, front matter. Raw HTML is escaped. */

const ATX=/^ {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$/;

let REFS=new Map();
const REF_DEF=/^ {0,3}\[([^\]^][^\]]*)\]:\s*<?([^\s>]+)>?(?:\s+["'(]([^"')]*)["')])?\s*$/;

/* Post-processing: resolve links between documents, images, code copy */
function postProcess(){
  const base=dirOf(state.current||"");
  doc.querySelectorAll("a[data-href]").forEach(a=>{
    const u=a.getAttribute("data-href").trim();a.removeAttribute("data-href");

    if(!u){a.classList.add("broken");a.title="Empty link";return}
    if(u.startsWith("#")){a.href=hashFor(state.current,decodeSafe(u.slice(1)));return}
    if(/^[a-z][a-z0-9+.-]*:/i.test(u)||u.startsWith("//")){a.classList.add("broken");a.title="Link type not opened here: "+u;return}
    const k=u.indexOf("#"),pth=k<0?u:u.slice(0,k),frag=k<0?"":u.slice(k+1);
    const target=resolvePath(base,decodeSafe(pth.split("?")[0]));
    const d=findDoc(target);
    if(d){a.href=hashFor(d,decodeSafe(frag));a.title=d;return}
    const asset=lookup(target);
    if(asset){a.href=asset.content;a.download=asset.name;a.title="Download "+asset.name;return}
    a.classList.add("broken");a.title="Not in this library: "+target;
  });
  doc.querySelectorAll("img[data-src]").forEach(img=>{
    const u=img.getAttribute("data-src");img.removeAttribute("data-src");img.loading="lazy";
    if(/^https?:/i.test(u)||/^data:image\/(png|gif|jpe?g|webp|svg\+xml|bmp|avif)[;,]/i.test(u)){img.src=u;return}

    const s=document.createElement("span");s.className="img-missing";s.textContent=`Image not in library: ${p}${img.alt?` (${img.alt})`:""}`;img.replaceWith(s);
  });
  doc.querySelectorAll("pre").forEach(pre=>{const b=document.createElement("button");b.className="btn ghost code-copy";b.type="button";b.textContent="Copy";b.onclick=()=>copy(pre.querySelector("code").textContent,"Code copied");pre.appendChild(b)});
}

function model(list){const root={folders:new Map(),files:[],count:0};for(const f of list){const parts=f.path.split("/");let n=root;n.count++;for(let k=0;k<parts.length-1;k++){if(!n.folders.has(parts[k]))n.folders.set(parts[k],{folders:new Map(),files:[],count:0});n=n.folders.get(parts[k]);n.count++}n.files.push(f)}return root}

/* Full-text search */
function runSearch(q,quiet){
  state.terms=[...new Set(q.toLowerCase().split(/\s+/).filter(Boolean))];
  $("searchbox").classList.toggle("has-q",!!q);
  if(!state.terms.length){state.hits=[];drawSidebar();applyHighlight(false);return}
  const hits=[];
  for(const f of docs()){const lc=lcOf(f),lp=f.path.toLowerCase();let ok=true,count=0,inName=true;
    for(const t of state.terms){const n=lp.includes(t);let c=0,k=lc.indexOf(t);while(k>=0&&c<1000){c++;k=lc.indexOf(t,k+t.length)}if(!n&&!c){ok=false;break}if(!n)inName=false;count+=c}
    if(ok)hits.push({f,count,inName})}
  hits.sort((a,b)=>(b.inName-a.inName)||(b.count-a.count)||cmp(a.f.path,b.f.path));
  for(const h of hits.slice(0,200))h.snip=snippet(h.f);
  state.hits=hits;drawSidebar();if(!quiet&&state.current)applyHighlight(false);

  let a=Math.max(0,k-60),b=Math.min(f.content.length,k+120);if(a>0){const sp=f.content.indexOf(" ",a);if(sp>0&&sp<k)a=sp+1}
  const t=(a>0?"... ":"")+f.content.slice(a,b).replace(/!?\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/<[^>]*>?/g," ").replace(/:?-{3,}:?/g," ").replace(/[#>*`_|\\]+/g," ").replace(/\s+/g," ").trim()+(b<f.content.length?" ...":"");return hlText(t)}
search.addEventListener("input",()=>{clearTimeout(state.searchT);state.searchT=setTimeout(()=>runSearch(search.value),120)});
search.addEventListener("keydown",e=>{if(e.key==="Enter"){clearTimeout(state.searchT);runSearch(search.value);if(state.hits[0])go(state.hits[0].f.path)}else if(e.key==="Escape"){act("clearSearch")}else if(e.key==="ArrowDown"){e.preventDefault();sideBody.querySelector(".hit,.row")?.focus()}});

/* In-document highlights */

window.addEventListener("beforeunload",e=>{if(state.unsaved){saveNow();e.preventDefault();e.returnValue=""}});

/* Document and library actions */
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type:type||"text/plain"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function copy(text,msg){try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch{}t.remove()}toast(msg||"Copied")}
const stamp=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")};
async function markExported(paths){const ch=state.files.filter(f=>f.edited&&(!paths||paths.includes(f.path)));ch.forEach(f=>f.edited=false);if(ch.length)await dbPut(ch);if(!paths)prefs.lastExport=Date.now();savePrefs();drawSidebar();updateFooter();if(state.current)meta(cur())}
let CRC;function crc32(b){if(!CRC){CRC=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CRC[n]=c>>>0}}let c=0xFFFFFFFF;for(let k=0;k<b.length;k++)c=CRC[(c^b[k])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(entries){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  for(const e of entries){const name=enc.encode(e.name),data=e.data,crc=crc32(data),d=e.date;
    const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((Math.max(1980,d.getFullYear())-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,time,true);h.setUint16(12,date,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(h,name,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,time,true);c.setUint16(14,date,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cd.push(c,name);off+=30+name.length+data.length}
  const cdSize=cd.reduce((s,x)=>s+x.byteLength,0),end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,end],{type:"application/zip"});
}
function dataURLBytes(u){const k=u.indexOf(",");const meta=u.slice(0,k),body=u.slice(k+1);if(/;base64/i.test(meta)){const s=atob(body),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}return new TextEncoder().encode(decodeSafe(body))}
function relPath(fromDir,to){const a=fromDir?fromDir.split("/"):[],b=to.split("/");let i=0;while(i<a.length&&i<b.length-1&&a[i]===b[i])i++;return"../".repeat(a.length-i)+b.slice(i).join("/")}
const encodePath=p=>p.split("/").map(x=>x.replace(/ /g,"%20").replace(/\(/g,"%28").replace(/\)/g,"%29")).join("/");
function rewriteLinks(text,fromDir,toDir,fn){
  let n=0,fence=false;
  const fix=t=>{if(!t||/^[a-z][a-z0-9+.-]*:/i.test(t)||t.startsWith("#")||t.startsWith("//"))return null;const k=t.search(/[?#]/),pth=k<0?t:t.slice(0,k),tail=k<0?"":t.slice(k);if(!pth)return null;const tgt=fn(resolvePath(fromDir,decodeSafe(pth)));if(tgt==null)return null;n++;return encodePath(relPath(toDir,tgt))+tail};
  const out=text.split("\n").map(line=>{
    if(FENCE.test(line)){fence=!fence;return line}if(fence)return line;
    line=line.replace(/(\]\(\s*<?)([^\s)>]+)/g,(m,a,t)=>{const r=fix(t);return r==null?m:a+r});
    const d=line.match(/^( {0,3}\[[^\]]+\]:\s*<?)([^\s>]+)(.*)$/);if(d){const r=fix(d[2]);if(r!=null)line=d[1]+r+d[3]}
    return line}).join("\n");
  return{text:out,n};
}
async function newDoc(){
  const dir=state.current?dirOf(state.current):"";
  let p=prompt("Path for the new document (folders are created as needed):",(dir?dir+"/":"")+"untitled.md");if(p==null)return;
  p=normPath(p.trim());if(!p)return;if(!DOC_RE.test(p))p+=".md";
  if(lookup(p)){alert(`${p} already exists.`);return}
  const title=baseName(p).replace(DOC_RE,"").replace(/[-_]+/g," ");
  const f={path:p,name:baseName(p),kind:"doc",content:`# ${title.charAt(0).toUpperCase()+title.slice(1)}\n\n`,size:0,modified:Date.now(),imported:Date.now(),edited:!live.on};
  try{await persist([f])}catch(e){console.error(e);toast("Could not create the file");return}
  await refresh();go(p);setTimeout(()=>{setEditing(true);raw.setSelectionRange(raw.value.length,raw.value.length)},50);
}
async function renameDoc(){
  const f=cur();if(!f)return;await flushSave();
  let p=prompt("New path for this document. Change the folder part to move it.",f.path);if(p==null)return;p=normPath(p.trim());if(!p||p===f.path)return;if(!DOC_RE.test(p))p+=".md";
  if(lookup(p)&&p.toLowerCase()!==f.path.toLowerCase()){alert(`${p} already exists.`);return}
  const oldP=f.path,oldDir=dirOf(oldP),newDir=dirOf(p),inbound=[];
  for(const d of docs()){if(d.path===oldP)continue;const r=rewriteLinks(d.content,dirOf(d.path),dirOf(d.path),abs=>(abs===oldP||findDoc(abs)===oldP)?p:null);if(r.n)inbound.push({d,text:r.text,n:r.n})}
  const content=oldDir===newDir?f.content:rewriteLinks(f.content,oldDir,newDir,abs=>abs===oldP?p:abs).text;
  let doLinks=false;
  if(inbound.length){const total=inbound.reduce((t,x)=>t+x.n,0);doLinks=confirm(`${plural(total,"link")} in ${plural(inbound.length,"other document")} point to ${oldP}.\n\nOK updates them to the new path. Cancel leaves them as they are, and they will show as broken.`)}
  try{
    await persist([{...f,path:p,name:baseName(p),content,modified:Date.now(),edited:!live.on}]);
    await removeFiles([oldP]);
    if(doLinks)await persist(inbound.map(x=>({...x.d,content:x.text,modified:Date.now(),edited:!live.on})));
  }catch(e){console.error(e);toast("Rename failed: "+(e.message||e.name));await refresh();return}
  prefs.recent=prefs.recent.map(x=>x===oldP?p:x);state.current=null;await refresh();go(p);
  toast(doLinks?`Renamed. Updated ${plural(inbound.reduce((t,x)=>t+x.n,0),"link")}.`:oldDir!==newDir?"Moved. Links inside the document were adjusted.":"Renamed");
}
async function deleteDoc(){
  const f=cur();if(!f)return;
  const msg=live.on?`Delete "${f.path}" from disk?\n\nThis removes the file from ${live.root.name}. If the folder is not under version control or backed up, it cannot be recovered from here.`:`Remove "${f.path}" from this library?${f.edited?"\n\nThis document has edits that have not been exported. They will be lost.":""}\n\nThe original file on disk is not affected.`;
  if(!confirm(msg))return;
  const sib=docs(),k=sib.findIndex(x=>x.path===f.path),next=sib[k+1]||sib[k-1];
  state.unsaved=false;
  try{await removeFiles([f.path])}catch(e){console.error(e);toast("Could not delete the file");return}
  state.current=null;if(state.editing)setEditing(false);await refresh();
  if(next&&next.path!==f.path)go(next.path);else{history.replaceState(null,"",location.pathname+location.search);showEmpty()}
  toast(live.on?"Deleted from disk":"Removed from library");
}
async function restore(file){
  if(live.on){toast("Close the live folder to restore into the browser library");return}
  let obj;try{obj=JSON.parse(await file.text())}catch{alert("That file is not valid JSON.");return}
  const list=Array.isArray(obj)?obj:obj&&obj.files;
  if(!Array.isArray(list)){alert("That file is not a Markdown Library backup.");return}
  const recs=list.filter(f=>f&&typeof f.path==="string"&&typeof f.content==="string").map(f=>clean({...f,path:normPath(f.path),name:f.name||baseName(f.path)}));
  if(!recs.length){alert("The backup contains no documents.");return}
  const clash=recs.filter(r=>state.byPath.has(r.path)).length;
  if(clash&&!confirm(`Restore ${plural(recs.length,"file")}? ${clash} will replace documents with the same path.`))return;
  await dbPut(recs);await refresh();requestPersist();toast(`Restored ${plural(recs.length,"file")}`);if(!state.current){const d=recs.find(r=>r.kind==="doc");if(d)go(d.path)}
}
$("restoreInput").onchange=e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=""};

const actions={
  addFolder:()=>$("folderInput").click(),
  addFiles:()=>$("fileInput").click(),
  restore:()=>$("restoreInput").click(),
  newDoc,
  rename:renameDoc,
  delete:deleteDoc,
  edit:()=>setEditing(!state.editing),
  download:()=>{const f=cur();if(!f)return;flushSave();download(f.name.match(/\.(md|markdown|mdown|mkd|txt)$/i)?f.name:f.name+".md",raw.value&&state.editing?raw.value:f.content,"text/markdown");markExported([f.path])},
  print:async()=>{await flushSave();window.print()},
  copyMd:()=>{const f=cur();if(f)copy(f.content,"Markdown copied")},
  copyText:()=>copy(doc.innerText,"Text copied"),
  copyLink:()=>copy(location.href,"Link copied. It opens in this browser only."),
  exportZip:async()=>{if(!state.files.length){toast("Library is empty");return}await flushSave();const enc=new TextEncoder(),entries=[];
    for(const f of state.files)entries.push({name:f.path,data:isDoc(f)?enc.encode(f.content):f.blob?new Uint8Array(await f.blob.arrayBuffer()):dataURLBytes(f.content),date:new Date(f.modified||Date.now())});
    download(`${live.on?live.root.name.replace(/[^\w.-]+/g,"-"):"markdown-library"}-${stamp()}.zip`,makeZip(entries));await markExported();toast(`Exported ${plural(state.files.length,"file")} as ZIP`)},
  openFolder:async()=>{
    if(!canLive()){alert("Opening a folder for editing needs Chrome or Edge, version 86 or later. In this browser, use Import to keep a copy in the browser instead.");return}
    try{const h=await window.showDirectoryPicker({id:"md-library",mode:"readwrite"});if(!(await startLive(h,true)))toast("Permission to edit the folder was not granted")}
    catch(e){if(e.name!=="AbortError"){console.error(e);alert(`The browser did not allow folder access${e.message?": "+e.message:""}.\n\nManaged Chrome and Edge can turn this off by policy. Use Import instead, or ask IT about the File System Access settings.`)}}},
  closeFolder:()=>stopLive(),
  reconnect:async()=>{const h=await getHandle();if(!h){stopLive();return}try{if(!(await startLive(h,true,true)))toast("Permission was not granted")}catch(e){console.error(e);toast("That folder is no longer available");stopLive()}},
  rescan:()=>rescan(false),
  backup:async()=>{if(!state.files.length){toast("Library is empty");return}flushSave();download(`markdown-library-backup-${stamp()}.json`,JSON.stringify({format:"offline-markdown-library-v2",exported_at:new Date().toISOString(),files:state.files.map(clean)}),"application/json");await markExported();toast("Backup downloaded")},
  clear:async()=>{if(!state.files.length)return;const ed=state.files.filter(f=>f.edited).length;
    if(!confirm(`Remove all ${plural(state.files.length,"file")} from this browser's library?${ed?`\n\n${ed} edited document(s) have not been exported and will be lost. Cancel and use Export ZIP first if you need them.`:""}\n\nOriginal files on disk are not affected.`))return;
    await dbClear();state.unsaved=false;if(state.editing)setEditing(false);prefs.recent=[];expanded.clear();savePrefs();history.replaceState(null,"",location.pathname+location.search);await refresh();showEmpty();toast("Library cleared")},
  expandAll:()=>{for(const f of docs()){expandTo(f.path)}savePrefs();drawSidebar()},
  collapseAll:()=>{expanded.clear();if(state.current)expandTo(state.current);savePrefs();drawSidebar()},
  clearSearch:()=>{search.value="";runSearch("");search.blur()},
  findNext:()=>{if(state.marks.length){state.markIx=(state.markIx+1)%state.marks.length;focusMark()}},
  findPrev:()=>{if(state.marks.length){state.markIx=(state.markIx-1+state.marks.length)%state.marks.length;focusMark()}},
  toggleSide:()=>{if(matchMedia("(max-width:860px)").matches)app.classList.toggle("side-open");else app.classList.toggle("no-side")},
  toggleOutline:()=>{prefs.outline=!prefs.outline;savePrefs();applyLayout()},
  theme:()=>{prefs.theme=prefs.theme==="light"?"dark":"light";savePrefs();applyLayout()},
  persist:requestPersist,
};
function act(n){closeMenus();const f=actions[n];if(f)f()}
function applyLayout(){document.documentElement.dataset.theme=prefs.theme;$("themeBtn").textContent=prefs.theme==="light"?"Dark theme":"Light theme";app.classList.toggle("no-outline",!prefs.outline);$("outlineBtn").setAttribute("aria-pressed",String(prefs.outline))}

/* Menus */
function closeMenus(){document.querySelectorAll(".menu.open").forEach(m=>m.classList.remove("open"))}
function openMenu(id,btn){const m=$(id),was=m.classList.contains("open");closeMenus();if(was)return;m.classList.add("open");const r=btn.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;let x=Math.min(r.right-w,innerWidth-w-8);if(x<8)x=Math.min(r.left,innerWidth-w-8);let y=r.bottom+4;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-4);m.style.left=x+"px";m.style.top=y+"px";m.querySelector("button")?.focus()}
document.addEventListener("click",e=>{const mb=e.target.closest("[data-menu]");if(mb){openMenu(mb.dataset.menu,mb);return}const a=e.target.closest("[data-act]");if(a){act(a.dataset.act);return}if(!e.target.closest(".menu"))closeMenus()});

/* Keyboard */
document.addEventListener("keydown",e=>{
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase(),typing=/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if(mod&&k==="k"){e.preventDefault();if(app.classList.contains("no-side"))app.classList.remove("no-side");if(matchMedia("(max-width:860px)").matches)app.classList.add("side-open");search.focus();search.select();return}
  if(mod&&k==="e"){e.preventDefault();act("edit");return}
  if(mod&&k==="s"){e.preventDefault();if(state.editing){state.unsaved=true;saveNow()}return}
  if(e.key==="F3"||(mod&&k==="g")){e.preventDefault();act(e.shiftKey?"findPrev":"findNext");return}
  if(e.key==="Escape"){if(document.querySelector(".menu.open")){closeMenus();return}if(app.classList.contains("side-open")){app.classList.remove("side-open");return}if(state.terms.length&&!typing){act("clearSearch");return}}
  if(!typing&&!mod&&e.key==="/"){e.preventDefault();search.focus();search.select()}
  if(document.querySelector(".menu.open")&&(e.key==="ArrowDown"||e.key==="ArrowUp")){const items=[...document.querySelectorAll(".menu.open button")],i=items.indexOf(document.activeElement);e.preventDefault();items[(i+(e.key==="ArrowDown"?1:-1)+items.length)%items.length].focus()}
});

/* Drag and drop (files and whole folders) */
let depth=0;const drop=$("drop");
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes("Files");
window.addEventListener("dragenter",e=>{if(!hasFiles(e))return;e.preventDefault();depth++;drop.classList.add("show")});
window.addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault()});
window.addEventListener("dragleave",e=>{if(!hasFiles(e))return;if(--depth<=0){depth=0;drop.classList.remove("show")}});
window.addEventListener("drop",e=>{if(!hasFiles(e))return;e.preventDefault();depth=0;drop.classList.remove("show");entriesFromDrop(e.dataTransfer).then(importEntries).catch(()=>toast("Could not read the dropped items"))});

/* Start */
applyLayout();
(async()=>{
  try{
    if(prefs.mode==="live"&&canLive()){
      const h=await getHandle();
      if(h){if(await hasPermission(h,false)){if(await startLive(h,false,true))return}else{showReconnect(h);return}}
      prefs.mode="browser";savePrefs();
    }
    await refresh();
    const r=parseHash();
    if(r&&state.byPath.size)route();
    else{const first=prefs.recent.find(p=>state.byPath.has(p))||docs()[0]?.path;if(first)go(first);else showEmpty()}
    updateFooter();
  }catch(err){console.error(err);showEmpty();$("storageLine").textContent="Browser storage unavailable";toast("This browser profile blocks local storage. Imports will not be kept.")}
})();
})();
</script>
